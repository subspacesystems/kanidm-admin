# cargo-deny policy for this fork's checks (subspacesystems/kanidm-admin). Not part of upstream's
# kanidm-admin: our feature PRs leave this file out.

[licenses]
# Permissive licenses, plus MPL-2.0 (file-level copyleft; kanidm_client and kanidm_proto use it).
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
         "Unicode-3.0", "Zlib", "MPL-2.0", "CDLA-Permissive-2.0", "0BSD", "BSL-1.0", "CC0-1.0"]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Cargo.toml patches bisync from its repository (yanked from crates.io).
allow-git = ["https://github.com/JM4ier/bisync"]

[advisories]
# In upstream's Cargo.lock as of 907b95a (2026-10-25). Accepted so a change fails only on a new
# advisory; remove an entry once the lockfile no longer has it.
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa 0.9.10 (Marvin attack), through Kanidm's crates; upstream's lockfile" },
  { id = "RUSTSEC-2026-0249", reason = "smartstring 1.0.1, unmaintained; upstream's lockfile" },
  { id = "RUSTSEC-2026-0285", reason = "rustls 0.23.44; upstream's lockfile" },
  { id = "RUSTSEC-2026-0346", reason = "rustls 0.23.44; upstream's lockfile" },
  { id = "RUSTSEC-2026-0347", reason = "rustls 0.23.44; upstream's lockfile" },
  { id = "RUSTSEC-2026-0348", reason = "rustls 0.23.44; upstream's lockfile" },
  { id = "RUSTSEC-2026-0349", reason = "rustls 0.23.44; upstream's lockfile" },
  { id = "RUSTSEC-2026-0382", reason = "rustls-webpki 0.103.15; upstream's lockfile" },
  { id = "RUSTSEC-2026-0383", reason = "webpki-root-certs 1.0.9; upstream's lockfile" },
  { id = "RUSTSEC-2026-0386", reason = "tokio 1.53.1; upstream's lockfile" },
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5; upstream's lockfile" },
  { id = "RUSTSEC-2026-0440", reason = "astral-tokio-tar 0.6.4, unmaintained, through testcontainers; upstream's lockfile" },
  { id = "RUSTSEC-2026-0441", reason = "pin-utils 0.1.0, unmaintained; upstream's lockfile" },
]
